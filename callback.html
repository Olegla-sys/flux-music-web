<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Flux Music — TikTok Authorization</title>
  <style>
    body{margin:0;background:#09090b;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
    .card{max-width:560px;margin:24px;padding:32px;border:1px solid #29292e;border-radius:24px;background:#111114;text-align:center}
    h1{margin:0 0 12px;color:#ff304f} p{line-height:1.55;color:#d5d5da}
    code{display:block;margin-top:18px;padding:12px;background:#08080a;border-radius:12px;word-break:break-all;color:#eee}
  </style>
</head>
<body>
  <main class="card">
    <h1>FLUX MUSIC</h1>
    <p id="status">TikTok authorization response received. You may return to Discord.</p>
    <code id="result">Checking callback…</code>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get("code");
    const error = p.get("error");
    const result = document.getElementById("result");
    if (code) {
      result.textContent = "Authorization code received successfully.";
    } else if (error) {
      result.textContent = "TikTok authorization failed: " + error;
    } else {
      result.textContent = "Waiting for TikTok authorization response.";
    }
  </script>
</body>
</html>
